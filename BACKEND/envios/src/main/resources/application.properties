spring.application.name=envios
server.port=8085

# Base de datos independiente por microservicio (SRS - RNF06)
spring.datasource.url=jdbc:mysql://localhost:3306/db_smartlogix_envios?serverTimezone=UTC&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (debe coincidir con ms-auth)
jwt.secret=X2@pQ!8zH#1kM$eY6%WnR3vG7*CdT4bU^aL0sJ9fB5h
jwt.expiration=7200000
jwt.prefix=Bearer
jwt.header=Authorization

# Fechas como ISO string
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

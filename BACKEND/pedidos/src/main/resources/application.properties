spring.application.name=pedidos
server.port=8083

# Base de datos independiente por microservicio (SRS - RNF06)
spring.datasource.url=jdbc:mysql://localhost:3306/db_smartlogix_pedidos?serverTimezone=UTC&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (debe coincidir con ms-auth)
jwt.secret=X2@pQ!8zH#1kM$eY6%WnR3vG7*CdT4bU^aL0sJ9fB5h
jwt.expiration=7200000
jwt.prefix=Bearer
jwt.header=Authorization

# URL del microservicio Inventario
services.inventario.url=http://localhost:8082

# Circuit Breaker — Resilience4j (SRS - patrón requerido)
resilience4j.circuitbreaker.instances.inventario.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventario.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.inventario.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventario.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.inventario.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.inventario.automaticTransitionFromOpenToHalfOpenEnabled=true

# Fechas como ISO string en vez de array
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
